name: Build APK (arm64 only)

on:
    push:
        branches:
            - main
        paths-ignore:
            - 'README.md'
            - '.github/ISSUE_TEMPLATE/**'
    workflow_dispatch: {}

jobs:
    build-arm64:
        runs-on: ubuntu-latest
        steps:
            - name: Liberar espacio en disco
              uses: jlumbroso/free-disk-space@main
              with:
                  tool-cache: false
                  android: false
                  dotnet: true
                  haskell: true
                  large-packages: true
                  docker-images: true
                  swap-storage: true

            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Instalar dependencias
              run: npm ci

            - name: Generar carpeta android (expo prebuild)
              run: npx expo prebuild --platform android --clean

            - name: Liberar espacio extra (caches npm/expo, sin tocar SDK/NDK ni node_modules)
              run: |
                  rm -rf ~/.npm /tmp/metro-* /tmp/haste-* $HOME/.expo
                  df -h

            - name: Configurar Gradle (5GB RAM, sin daemon, sin paralelismo, R8 en modo liviano)
              working-directory: android
              run: |
                  {
                    echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dcom.android.build.gradle.r8.maxMemory=3g"
                    echo "org.gradle.daemon=false"
                    echo "org.gradle.parallel=false"
                    echo "org.gradle.workers.max=1"
                    echo "org.gradle.caching=false"
                    echo "android.enableJetifier=true"
                    echo "android.enableR8.fullMode=false"
                  } >> gradle.properties

            - name: Compilar APK release (solo arm64-v8a, sin lint ni checks de dev)
              working-directory: android
              env:
                  ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
              run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -x testReleaseUnitTest --console=plain

            - name: Limpiar cachés de gradle
              if: always()
              run: rm -rf ~/.gradle/caches ~/.gradle/wrapper

            - name: Subir APK como artefacto
              uses: actions/upload-artifact@v4
              with:
                  name: chatterui-arm64
                  path: android/app/build/outputs/apk/release/*.apk
                  retention-days: 14
